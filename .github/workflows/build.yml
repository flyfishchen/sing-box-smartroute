name: Build & Release SmartRoute (Sync Latest sing-box)

on:
  push:
    branches:
      - main
      - master
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 自动检查 SagerNet/sing-box 是否有新正式版发布
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: "Target SagerNet/sing-box release tag (e.g. latest or v1.14.4)"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve Latest sing-box Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Query SagerNet/sing-box Latest Release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.sing_box_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ] && [ "${INPUT_VERSION}" != "latest" ]; then
            TAG="${INPUT_VERSION}"
          else
            TAG=$(gh api repos/SagerNet/sing-box/releases/latest --jq '.tag_name')
          fi
          VERSION="${TAG#v}"
          echo "Resolved SagerNet/sing-box tag=${TAG} (version=${VERSION})"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${EVENT_NAME}" = "schedule" ]; then
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists on schedule trigger, skipping build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  test:
    name: Verify SmartRoute Unit Tests
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SmartRoute Extension
        uses: actions/checkout@v4
        with:
          path: smartroute-ext

      - name: Clone SagerNet/sing-box (${{ needs.resolve-version.outputs.tag }})
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-version.outputs.tag }}" https://github.com/SagerNet/sing-box.git sing-box-src
          mkdir -p sing-box-src/smartroute
          cp smartroute-ext/*.go smartroute-ext/*.html smartroute-ext/README* sing-box-src/smartroute/
          cp smartroute-ext/cmd/sing-box/smartroute.go sing-box-src/cmd/sing-box/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box-src/go.mod
          cache-dependency-path: sing-box-src/go.sum

      - name: Run SmartRoute Unit Tests
        working-directory: sing-box-src
        run: go test -v ./smartroute

  build:
    name: Build (${{ matrix.name }})
    needs: [resolve-version, test]
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            goamd64: v1
            ext: ""
            archive: tar.gz
          - name: linux-amd64-v3
            goos: linux
            goarch: amd64
            goamd64: v3
            ext: ""
            archive: tar.gz
          - name: linux-arm64
            goos: linux
            goarch: arm64
            goamd64: ""
            ext: ""
            archive: tar.gz
          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            goamd64: ""
            ext: ""
            archive: tar.gz
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            goamd64: v1
            ext: ""
            archive: tar.gz
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            goamd64: ""
            ext: ""
            archive: tar.gz
          - name: windows-amd64
            goos: windows
            goarch: amd64
            goamd64: v1
            ext: ".exe"
            archive: zip
          - name: windows-arm64
            goos: windows
            goarch: arm64
            goamd64: ""
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout SmartRoute Extension
        uses: actions/checkout@v4
        with:
          path: smartroute-ext

      - name: Clone SagerNet/sing-box (${{ needs.resolve-version.outputs.tag }})
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-version.outputs.tag }}" https://github.com/SagerNet/sing-box.git sing-box-src
          mkdir -p sing-box-src/smartroute
          cp smartroute-ext/*.go smartroute-ext/*.html smartroute-ext/README* sing-box-src/smartroute/
          cp smartroute-ext/cmd/sing-box/smartroute.go sing-box-src/cmd/sing-box/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box-src/go.mod
          cache-dependency-path: sing-box-src/go.sum

      - name: Compile sing-box with SmartRoute (${{ matrix.name }})
        working-directory: sing-box-src
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TARGET_NAME: ${{ matrix.name }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          if [ -f release/DEFAULT_BUILD_TAGS_OTHERS ]; then
            TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS | tr -d '\r\n')
          else
            TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale"
          fi
          LDFLAGS_EXTRA=""
          if [ -f release/LDFLAGS ]; then
            LDFLAGS_EXTRA=$(cat release/LDFLAGS | tr -d '\r\n')
          fi

          mkdir -p ../dist
          STAGE_DIR="sing-box-${VERSION}-smartroute-${TARGET_NAME}"
          mkdir -p "../dist/${STAGE_DIR}"

          BIN_NAME="sing-box${EXT}"
          go build -v -trimpath \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}-smartroute' ${LDFLAGS_EXTRA} -s -w -buildid=" \
            -o "../dist/${STAGE_DIR}/${BIN_NAME}" \
            ./cmd/sing-box

          cp ../smartroute-ext/README.md "../dist/${STAGE_DIR}/"
          cp ../smartroute-ext/README.en.md "../dist/${STAGE_DIR}/"
          cp LICENSE "../dist/${STAGE_DIR}/"

          cd ../dist
          # 同时提供独立二进制文件（方便直接替换升级）与标准压缩包
          cp "${STAGE_DIR}/${BIN_NAME}" "sing-box-${TARGET_NAME}${EXT}"
          if [ "${ARCHIVE}" = "zip" ]; then
            zip -r "${STAGE_DIR}.zip" "${STAGE_DIR}"
          else
            tar -czvf "${STAGE_DIR}.tar.gz" "${STAGE_DIR}"
          fi
          rm -rf "${STAGE_DIR}"

      - name: Upload Build Artifact (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [resolve-version, build]
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release (${{ needs.resolve-version.outputs.tag }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: "sing-box ${{ needs.resolve-version.outputs.tag }} (with SmartRoute)"
          make_latest: true
          generate_release_notes: true
          body: |
            ### sing-box `${{ needs.resolve-version.outputs.tag }}` with SmartRoute Extension
            - **Upstream Base**: [`SagerNet/sing-box@${{ needs.resolve-version.outputs.tag }}`](https://github.com/SagerNet/sing-box/releases/tag/${{ needs.resolve-version.outputs.tag }})
            - **Built-in Web Console**: `http://<clash_api_listen>/smartroute`
            - **Default 1-RTT Probe**: `http://1.1.1.1/cdn-cgi/trace` (with pre-circuit-break active probe verification)
            - **Included Binaries**:
              - `linux-amd64`, `linux-amd64-v3`, `linux-arm64`, `linux-armv7`
              - `darwin-amd64`, `darwin-arm64`
              - `windows-amd64`, `windows-arm64`
          files: artifacts/*
